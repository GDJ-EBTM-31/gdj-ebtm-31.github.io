# Publie le seul dossier app/ sur GitHub Pages, à chaque envoi sur main.
# Rien d'autre du dépôt n'est mis en ligne : ni le PDF du responsable, ni docs/.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de republier à la main depuis l’onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pdftotext : c'est lui qui permet de comparer la fiche affichée au PDF d'origine.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Rien ne part en ligne si le contenu ou les contrastes ne passent pas.
      - run: node scripts/verifier-contenu.mjs
      - run: node scripts/verifier-detection.mjs
      - run: node scripts/verifier-contrastes.mjs

  publier:
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploiement
        uses: actions/deploy-pages@v4
