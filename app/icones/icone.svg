<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GDJ">
  <!-- L'icône de l'application : « GDJ » en grosses lettres blanches, droites, sur l'aplat de
       l'affiche. Demandée ainsi par Sébastien le 12 novembre 2026, après un essai sur un
       coup de pinceau blanc. Les lettres sont des tracés (Bricolage Grotesque, graisse 800),
       épaissies par un contour, pour que ce fichier se lise sans la police. Les images PNG
       en sont tirées par scripts/generer-icones.mjs, qui retire les coins arrondis du fond
       (le téléphone arrondit lui-même). -->
